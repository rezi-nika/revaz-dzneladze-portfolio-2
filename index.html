    // 2. THEME CONTEXT (მუქი / ნათელი თემის მართვა)
    // ============================================================
    const ThemeContext = createContext();

    const ThemeProvider = ({ children }) => {
      const [theme, setTheme] = useState(() => {
        const saved = localStorage.getItem('theme');
        return saved === 'light' ? 'light' : 'dark';
      });

      useEffect(() => {
        const root = document.documentElement;
        if (theme === 'light') {
          root.classList.add('light');
          root.classList.remove('dark');
        } else {
          root.classList.add('dark');
          root.classList.remove('light');
        }
        localStorage.setItem('theme', theme);
      }, [theme]);

      const toggleTheme = () => {
        setTheme(prev => (prev === 'dark' ? 'light' : 'dark'));
      };

      return (
        <ThemeContext.Provider value={{ theme, toggleTheme, isDark: theme === 'dark' }}>
          {children}
        </ThemeContext.Provider>
      );
    };

    const useTheme = () => useContext(ThemeContext);

              <div className="space-y-2 max-h-96 overflow-y-auto pr-1">
                {todos.map((todo) => (
                  <div key={todo.id} className="flex items-start gap-3 p-3 rounded-xl bg-forest-950/80 border border-brand-900/50 hover:border-brand-500/40 transition-colors">
                    <span className={`mt-0.5 w-5 h-5 rounded-full flex-shrink-0 flex items-center justify-center border-2 ${todo.completed ? 'bg-brand-500 border-brand-500 text-forest-990' : 'border-zinc-600 text-transparent'}`}>
                      {todo.completed && <i className="fa-solid fa-check text-[9px]"></i>}
                    </span>
                    <span className={`text-xs leading-relaxed flex-1 ${todo.completed ? 'line-through text-zinc-500' : 'text-zinc-200'}`}>
                      {todo.title}
                    </span>
                    <span className={`text-[10px] font-mono flex-shrink-0 ${todo.completed ? 'text-brand-400' : 'text-amber-400'}`}>
                      {todo.completed ? 'შესრულდა' : 'მოლოდინში'}
                    </span>
                  </div>
                ))}
              </div>
            )}
          </Modal>
        </section>
      );
    };

    // Contact Section
    const Contact = () => {
      const [formData, setFormData] = useState({ name: '', email: '', subject: '', message: '' });
      const [submitted, setSubmitted] = useState(false);
      const [loading, setLoading] = useState(false);

      const handleChange = (e) => {
        const { name, value } = e.target;
        setFormData(prev => ({ ...prev, [name]: value }));
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        setLoading(true);
        setTimeout(() => {
          setLoading(false);
          setSubmitted(true);
          setFormData({ name: '', email: '', subject: '', message: '' });
          setTimeout(() => setSubmitted(false), 5000);
        }, 800);
      };

      const contactItems = [
        { icon: 'fa-regular fa-envelope', label: 'ელფოსტა', value: personalInfo.email, href: `mailto:${personalInfo.email}` },
        { icon: 'fa-solid fa-phone', label: 'ტელეფონი', value: personalInfo.phone, href: `tel:${personalInfo.phone.replace(/\s+/g, '')}` },
        { icon: 'fa-solid fa-location-dot', label: 'მისამართი', value: personalInfo.location, href: '#' },
        { icon: 'fa-brands fa-github', label: 'GitHub', value: 'github.com/revaz', href: personalInfo.github, external: true },
        { icon: 'fa-brands fa-linkedin', label: 'LinkedIn', value: 'linkedin.com/in/revaz', href: personalInfo.linkedin, external: true },
      ];

      return (
        <section id="contact" className="scroll-mt-24 space-y-8">
          <SectionHeader
            badge="კავშირი"
            badgeIcon="fa-regular fa-paper-plane"
            title="დამიკავშირდით"
            subtitle="გაქვთ საინტერესო პროექტი ან გსურთ თანამშრომლობა? სიამოვნებით განვიხილავ თქვენს წინადადებას:"
          />
          <div className="grid grid-cols-1 lg:grid-cols-5 gap-6 sm:gap-8">
            <div className="lg:col-span-2 space-y-4">
              <div className="space-y-3">
                {contactItems.map((item, idx) => (
                  <Card
                    key={idx}
                    as="a"
                    href={item.href}
                    target={item.external ? '_blank' : undefined}
                    rel={item.external ? 'noopener noreferrer' : undefined}
                    className="flex items-center gap-4 p-4 !rounded-2xl cursor-pointer group"
                  >
                    <div className="w-11 h-11 rounded-xl bg-brand-500/15 border border-brand-500/30 flex items-center justify-center text-brand-300 group-hover:scale-110 group-hover:bg-brand-500 group-hover:text-forest-990 transition-all flex-shrink-0">
                      <i className={`${item.icon} text-base`}></i>
                    </div>
                    <div className="min-w-0 flex-1">
                      <span className="block text-[11px] font-mono text-zinc-400">{item.label}</span>
                      <span className="text-sm font-semibold text-white group-hover:text-brand-300 transition-colors truncate block">
                        {item.value}
                      </span>
                    </div>
                    <i className="fa-solid fa-arrow-right text-xs text-brand-400/40 group-hover:text-brand-300 group-hover:translate-x-1 transition-all"></i>
                  </Card>
                ))}
              </div>
              <Card className="p-4 !rounded-2xl bg-gradient-to-br from-forest-900 to-forest-950 border-brand-500/30">
                <div className="flex items-center gap-3">
                  <span className="relative flex h-3 w-3">
                    <span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-brand-400 opacity-75"></span>
                    <span className="relative inline-flex rounded-full h-3 w-3 bg-brand-500"></span>
                  </span>
                  <div>
                    <span className="block text-xs font-bold text-white">სტატუსი: ხელმისაწვდომი</span>
                    <span className="text-[11px] text-zinc-400">პასუხის ტიპური დრო: 24 საათში</span>
                  </div>
                </div>
              </Card>
            </div>

            <div className="lg:col-span-3">
              <Card className="p-6 sm:p-8" hover={false}>
                {submitted && (
                  <div className="mb-6 p-4 rounded-xl bg-brand-500/15 border border-brand-500/40 text-brand-300 flex items-center gap-3 text-sm animate-fade-in">
                    <i className="fa-solid fa-circle-check text-lg text-brand-400"></i>
                    <div>
                      <strong className="block font-bold">გმადლობთ, შეტყობინება გაგზავნილია!</strong>
                      <span className="text-xs text-zinc-300">უმოკლეს დროში დაგიკავშირდებით.</span>
                    </div>
                  </div>
                )}
                <form onSubmit={handleSubmit} className="space-y-4">
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div className="space-y-1.5">
                      <label htmlFor="name" className="block text-xs font-mono text-zinc-300">თქვენი სახელი *</label>
                      <input
                        id="name"
                        name="name"
                        type="text"
                        required
                        value={formData.name}
                        onChange={handleChange}
                        placeholder="მაგ: გიორგი"
                        className="w-full px-4 py-2.5 rounded-xl bg-forest-950 border border-brand-900/70 text-zinc-200 placeholder-zinc-500 text-sm focus:outline-none focus:border-brand-500 focus:ring-1 focus:ring-brand-500 transition-all"
                      />
                    </div>
                    <div className="space-y-1.5">
                      <label htmlFor="email" className="block text-xs font-mono text-zinc-300">ელფოსტა *</label>
                      <input
                        id="email"
                        name="email"
                        type="email"
                        required
                        value={formData.email}
                        onChange={handleChange}
                        placeholder="name@example.com"
                        className="w-full px-4 py-2.5 rounded-xl bg-forest-950 border border-brand-900/70 text-zinc-200 placeholder-zinc-500 text-sm focus:outline-none focus:border-brand-500 focus:ring-1 focus:ring-brand-500 transition-all"
                      />
                    </div>
                  </div>
                  <div className="space-y-1.5">
                    <label htmlFor="subject" className="block text-xs font-mono text-zinc-300">თემა</label>
                    <input
                      id="subject"
                      name="subject"
                      type="text"
                      value={formData.subject}
                      onChange={handleChange}
                      placeholder="პროექტის შეთავაზება / კონსულტაცია"
                      className="w-full px-4 py-2.5 rounded-xl bg-forest-950 border border-brand-900/70 text-zinc-200 placeholder-zinc-500 text-sm focus:outline-none focus:border-brand-500 focus:ring-1 focus:ring-brand-500 transition-all"
                    />
                  </div>
                  <div className="space-y-1.5">
                    <label htmlFor="message" className="block text-xs font-mono text-zinc-300">შეტყობინება *</label>
                    <textarea
                      id="message"
                      name="message"
                      rows="4"
                      required
                      value={formData.message}
                      onChange={handleChange}
                      placeholder="მოგვიყევით თქვენი პროექტის ან იდეის შესახებ..."
                      className="w-full px-4 py-2.5 rounded-xl bg-forest-950 border border-brand-900/70 text-zinc-200 placeholder-zinc-500 text-sm focus:outline-none focus:border-brand-500 focus:ring-1 focus:ring-brand-500 transition-all resize-none"
                    ></textarea>
                  </div>
                  <div className="pt-2 flex items-center justify-between">
                    <span className="text-[11px] text-zinc-500 font-mono">* სავალდებულო ველები</span>
                    <Button type="submit" variant="primary" size="md" icon="fa-regular fa-paper-plane" loading={loading}>
                      გაგზავნა
                    </Button>
                  </div>
                </form>
              </Card>
            </div>
          </div>
        </section>
      );
    };

    // Footer Component
    const Footer = () => {
      const scrollToTop = () => window.scrollTo({ top: 0, behavior: 'smooth' });

      return (
        <footer id="footer" className="border-t border-brand-900/60 bg-forest-990/90 backdrop-blur-xl py-8 sm:py-10 mt-16 sm:mt-24">
          <div className="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col md:flex-row items-center justify-between gap-5 text-xs sm:text-sm text-zinc-400 text-center md:text-left">
            <div>
              <p>&copy; 2026 <span className="text-brand-400 font-semibold">{personalInfo.name}</span>. ყველა უფლება დაცულია.</p>
              <p className="text-[11px] text-zinc-500 font-mono mt-0.5">Built with React 18 & Tailwind CSS</p>
            </div>
            <div className="flex items-center gap-5">
              <a href={personalInfo.github} target="_blank" rel="noopener noreferrer" className="hover:text-brand-300 transition-colors flex items-center gap-1.5 py-1">
                <i className="fa-brands fa-github text-base"></i>
                <span>GitHub</span>
              </a>
              <span className="text-brand-900">|</span>
              <a href={personalInfo.linkedin} target="_blank" rel="noopener noreferrer" className="hover:text-brand-300 transition-colors flex items-center gap-1.5 py-1">
                <i className="fa-brands fa-linkedin text-base"></i>
                <span>LinkedIn</span>
              </a>
              <span className="text-brand-900">|</span>
              <a href="index.html" className="hover:text-brand-300 transition-colors">მთავარი</a>
              <span className="text-brand-900">·</span>
              <a href="index1.html" className="hover:text-brand-300 transition-colors">პროექტები</a>
              <span className="text-brand-900">·</span>
              <a href="employees.html" className="hover:text-brand-300 transition-colors">თანამშრომლები</a>
            </div>
            <div>
              <button
                type="button"
                onClick={scrollToTop}
                className="inline-flex items-center gap-1.5 px-3.5 py-2 rounded-xl bg-forest-900 border border-brand-900/80 text-brand-300 hover:text-white hover:border-brand-500/50 hover:bg-forest-850 transition-all text-xs font-mono cursor-pointer shadow-sm"
              >
                <i className="fa-solid fa-arrow-up text-xs"></i>
                <span>ზევით დაბრუნება</span>
              </button>
            </div>
          </div>
        </footer>
      );
    };

    // ============================================================
    // 6. MAIN APP COMPONENT (მთავარი აპლიკაცია)
    // ============================================================
    const App = () => {
      return (
        <div className="text-zinc-200 font-sans antialiased selection:bg-brand-500 selection:text-black min-h-screen relative overflow-x-hidden flex flex-col justify-between">
          {/* Ambient Lighting & Cyber Grid */}
          <div className="fixed inset-0 pointer-events-none -z-10 overflow-hidden" aria-hidden="true">
            <div className="absolute -top-32 -left-32 w-[550px] sm:w-[650px] h-[550px] sm:h-[650px] bg-brand-500/25 rounded-full blur-[130px] animate-pulse-emerald"></div>
            <div className="absolute top-1/4 -right-32 w-[500px] sm:w-[600px] h-[500px] sm:h-[600px] bg-teal-400/20 rounded-full blur-[140px] animate-float-slow"></div>
            <div className="absolute top-2/3 -left-32 w-[600px] sm:w-[700px] h-[600px] sm:h-[700px] bg-emerald-600/22 rounded-full blur-[150px]"></div>
            <div className="absolute -bottom-32 right-1/4 w-[550px] sm:w-[650px] h-[550px] sm:h-[650px] bg-brand-400/20 rounded-full blur-[140px] animate-pulse-emerald"></div>
            <div className="absolute inset-0 bg-[linear-gradient(to_right,#10b98115_1px,transparent_1px),linear-gradient(to_bottom,#10b98115_1px,transparent_1px)] bg-[size:36px_36px]"></div>
            <div className="absolute inset-0 bg-[radial-gradient(circle_at_50%_0%,rgba(16,185,129,0.18),transparent_65%)]"></div>
          </div>

          <Navbar />

          <main className="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 py-8 sm:py-14 space-y-16 sm:space-y-24 flex-grow w-full">
            <Hero />
            <Skills />
            <Projects />
            <Experience />
            <Employees />
            <Contact />
          </main>

          <Footer />
        </div>
      );
    };

    // Render React App
    ReactDOM.createRoot(document.getElementById('root')).render(
      <ThemeProvider>
        <App />
      </ThemeProvider>
    );
  </script>
</body>

</html>
